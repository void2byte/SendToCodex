name: Build VSIX

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-terminal-recorder-vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: Publish to Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VSCE_PAT)) {
            throw "Repository secret VSCE_PAT is required to publish release tags."
          }
          $version = node -p "require('./package.json').version"
          $packagePath = "codex-terminal-recorder-$version.vsix"
          npx --cache .npm-cache @vscode/vsce publish `
            --packagePath $packagePath `
            --no-dependencies `
            --allow-proposed-apis terminalDataWriteEvent

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
